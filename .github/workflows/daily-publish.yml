# Daily Prompt Publish — GitHub Actions
# Trigger: cron (setiap hari jam 8 AM WIB = 1 AM UTC) + manual
# Job 1: Generate prompt candidates → rank → publish to Hugo content
# Job 2: Build Hugo → deploy ke GitHub Pages

name: Daily Prompt Publish

on:
  schedule:
    - cron: "0 1 * * *"   # 8 AM WIB (UTC+7) = 1 AM UTC
  workflow_dispatch:

jobs:
  generate-publish:
    runs-on: ubuntu-latest
    outputs:
      prompt_title: ${{ steps.publish.outputs.prompt_title }}
      prompt_score: ${{ steps.publish.outputs.prompt_score }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Generate & publish prompt
        id: publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_and_publish.py
        working-directory: ./
        continue-on-error: false

      - name: Commit & push
        run: |
          git config user.name "GodTier Bot"
          git config user.email "bot@godtier.store"
          git add content/prompts/ static/ 2>/dev/null || true
          git diff --quiet || git commit -m "🤖 Daily prompt: ${{ steps.publish.outputs.prompt_title }} (${{ steps.publish.outputs.prompt_score }}/10)"
          git push

  build-deploy:
    runs-on: ubuntu-latest
    needs: generate-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        run: hugo --gc --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: godtier.store
          commit_message: "🚀 Deploy: Daily prompt — ${{ needs.generate-publish.outputs.prompt_title }}"
