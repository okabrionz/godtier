{{/* Taxonomy terms list (categories) */}}
{{ define "title" }}{{ .Title }} — {{ site.Title }}{{ end }}
{{ define "main" }}
<div class="gt-hero" style="padding-block: 2.5rem 1rem;">
  <div class="container">
    <h1>{{ .Title }}</h1>
    <p class="lead">Browse all prompt categories.</p>
  </div>
</div>

<div class="container">
  <div class="gt-prompt-grid">
    {{ range $name, $taxonomy := .Data.Terms }}
    <a href="{{ $.Site.BaseURL }}{{ $.Data.Plural }}/{{ $name | urlize }}/" class="gt-prompt-card">
      <h3 class="card-title">{{ $name | title }}</h3>
      <span class="badge">{{ len $taxonomy.Pages }} prompts</span>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
